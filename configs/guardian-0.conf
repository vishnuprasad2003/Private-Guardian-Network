# ─────────────────────────────────────────────────────────────────────────────
# Private Guardian Network — Guardian-0 (Bootstrap Node)
# ─────────────────────────────────────────────────────────────────────────────

# ─── BASE STORAGE ────────────────────────────────────────────────────────────
# All runtime data (logs, keys, pids, sockets, backups) stored under BASE_DIR.
# Change this single variable to relocate everything.
BASE_DIR="/solana/wormhole"

# ─── GUARDIAN IDENTITY ───────────────────────────────────────────────────────
GUARDIAN_INDEX=0
GUARDIAN_NAME="guardian-0"
NETWORK_ID="/wormhole/private/mainnet/1"
NUM_GUARDIANS=3

# ─── ANVIL (Local EVM — Guardian Registry) ──────────────────────────────────
# Anvil is ONLY used to store:
#   - Guardian registry contract (guardian addresses)
#   - Bridge contract addresses
#   - RPC endpoint configuration
# No transactions are made through Anvil - it's just a registry storage.
ANVIL_PORT=8545
ANVIL_HOST="127.0.0.1"
ANVIL_CHAIN_ID=31337
# Block time: 0 = on-demand (only create blocks when transactions arrive)
# Since we don't make transactions, blocks are only created during initial deployment
ANVIL_BLOCK_TIME=0
# State interval: 0 = save anvil-state.json only on graceful shutdown (SIGTERM).
# Registry is write-once; do not re-run deploy-anvil on the VM once GETH_CONTRACT is live.
ANVIL_STATE_INTERVAL=0
# Anvil storage paths (under BASE_DIR)
ANVIL_STATE_FILE="${BASE_DIR}/data/anvil-state.json"
ANVIL_LOG_FILE="${BASE_DIR}/logs/anvil.log"
ANVIL_PID_FILE="${BASE_DIR}/pids/anvil.pid"
ANVIL_PRIVATE_KEY="ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
GETH_RPC="ws://${ANVIL_HOST}:${ANVIL_PORT}"
GETH_RPC_HTTP="http://${ANVIL_HOST}:${ANVIL_PORT}"
GETH_CONTRACT="0xb7f8bc63bbcad18155201308c8f3540b07f84f5e"

# ─── AVALANCHE L1 SUBNET ────────────────────────────────────────────────────
AVALANCHE_RPC="ws://104.42.155.78:9650/ext/bc/2ALtzRYgRpRWnTgjdrMArkMvU6RTpcjs7VWmupqYaPrHDrHLSd/ws"
AVALANCHE_RPC_HTTP="http://104.42.155.78:9650/ext/bc/2ALtzRYgRpRWnTgjdrMArkMvU6RTpcjs7VWmupqYaPrHDrHLSd/rpc"
AVALANCHE_CHAIN_ID=101122
AVALANCHE_CONTRACT="0x1499e9a1649bf091a75dcbb4f7c67727e8394385"
AVALANCHE_DEPLOYER_KEY="476645f88bc9ef81a40a45ef84972b8e71944f1bd7080cf2b0d6efdc60ee43e6"

# ─── FUJI C-CHAIN (Public Avalanche Testnet) ─────────────────────────────────
# Uses BSC watcher slot (--bscRPC) since --avalancheRPC is taken by Private L1.
# Guardian assigns Wormhole chain ID 4 (BSC's ID) to messages from Fuji.
# This is purely an identifier — the guardian watches any EVM chain on any slot.
BSC_RPC="wss://api.avax-test.network/ext/bc/C/ws"
BSC_CONTRACT="0x4131eda10e2516a354d5b65eebc8df695972e43e"

# ─── SOLANA CLUSTER ──────────────────────────────────────────────────────────
# Guardian uses HTTP RPC only (the Solana watcher polls via HTTP internally)
SOLANA_RPC="https://api.devnet.solana.com"
SOLANA_CONTRACT="8H8eLi9jcpssoxMmENSbu2WnXo4shqLVsnFEpifhKK8w"
SOLANA_DEPLOYER_KEY="/solana/keys/faucet.json"

# ─── P2P NETWORK ────────────────────────────────────────────────────────────
P2P_PORT=8999
BOOTSTRAP_PEERS=""   # empty for the bootstrap node itself

# ─── PORTS ───────────────────────────────────────────────────────────────────
GRPC_PORT=7000       # VAA API
STATUS_PORT=6600     # Prometheus metrics

# ─── STORAGE PATHS (all under BASE_DIR, configurable) ───────────────────────
# Guardian node storage
KEY_FILE="${BASE_DIR}/keys/${GUARDIAN_NAME}.key"
NODE_KEY_FILE="${BASE_DIR}/keys/node-${GUARDIAN_INDEX}.key"
DATA_DIR="${BASE_DIR}/data/${GUARDIAN_NAME}"           # BadgerDB for VAAs
LOG_FILE="${BASE_DIR}/logs/${GUARDIAN_NAME}.log"       # Guardian logs
PID_FILE="${BASE_DIR}/pids/${GUARDIAN_NAME}.pid"       # Process ID
ADMIN_SOCKET="${BASE_DIR}/sockets/${GUARDIAN_NAME}.sock"
GRPC_SOCKET="${BASE_DIR}/sockets/publicrpc-${GUARDIAN_INDEX}.sock"

# Log rotation settings (to prevent log files from growing indefinitely)
LOG_MAX_SIZE="100M"      # Rotate when log reaches 100MB
LOG_MAX_FILES=5          # Keep 5 rotated log files
LOG_COMPRESS=true        # Compress old logs

# VAA database settings
VAA_DB_DIR="${DATA_DIR}/db"              # BadgerDB location (inside DATA_DIR)
VAA_PURGE_ENABLED=false                  # Auto-purge old VAAs (disabled by default)
VAA_PURGE_RETENTION_DAYS=30              # Keep VAAs for 30 days if purge enabled

# ─── SETTINGS ────────────────────────────────────────────────────────────────
LOG_LEVEL="info"
DISABLE_TELEMETRY=true
UNSAFE_DEV_MODE=true

# ─── STORAGE OPTIMIZATION ────────────────────────────────────────────────────
# Foundry cache/data (redirected via symlink in start-anvil.sh)
FOUNDRY_CACHE_DIR="${BASE_DIR}/.foundry/cache"
FOUNDRY_DATA_DIR="${BASE_DIR}/.foundry/data"
# Backup directory
BACKUP_DIR="${BASE_DIR}/backups"
# Contract storage
CONTRACTS_EVM_DIR="${BASE_DIR}/contracts/evm"
CONTRACTS_SOLANA_DIR="${BASE_DIR}/contracts/solana"

# ─── GUARDIAN SET (deterministic in unsafeDevMode) ───────────────────────────
GUARDIAN_ADDRESSES="0xbeFA429d57cD18b7F8A4d91A2da9AB4AF05d0FBe,0x88D7D8B32a9105d228100E72dFFe2Fae0705D31c,0x58076F561CC62A47087B567C86f986426dFCD000"

# ─── GUARDIAND BINARY ────────────────────────────────────────────────────────
GUARDIAND_BIN="../wormhole/build/bin/guardiand"
