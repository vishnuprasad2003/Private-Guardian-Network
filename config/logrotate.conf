# =============================================================================
# LOG ROTATION CONFIGURATION
# =============================================================================
# This is a TEMPLATE file. Update paths before installing.
#
# Installation:
#   1. Edit paths in this file to match your installation
#   2. Copy to logrotate: sudo cp config/logrotate.conf /etc/logrotate.d/guardian-network
#   3. Test: sudo logrotate -d /etc/logrotate.d/guardian-network
#   4. Force rotation: sudo logrotate -f /etc/logrotate.d/guardian-network
#
# Default paths assume installation at /opt/guardian-network
# Update these paths if installed elsewhere
# =============================================================================

# Guardian logs
/opt/guardian-network/logs/guardian-*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    maxsize 100M
    dateext
    dateformat -%Y%m%d
}

# Anvil logs
