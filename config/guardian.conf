# =============================================================================
# PRIVATE GUARDIAN NETWORK - CONFIGURATION
# =============================================================================
# This file contains all configuration for the guardian node.
# Copy this file to each VM and modify GUARDIAN_INDEX and network-specific settings.
# =============================================================================

# -----------------------------------------------------------------------------
# GUARDIAN IDENTITY
# -----------------------------------------------------------------------------
# Unique index for this guardian (0, 1, 2, etc.)
# Each VM must have a different GUARDIAN_INDEX
GUARDIAN_INDEX=0

# Network identifier (must be same across all guardians)
NETWORK_ID="/wormhole/private/mainnet/1"

# -----------------------------------------------------------------------------
# GUARDIAN NETWORK SETTINGS
# -----------------------------------------------------------------------------
# Total number of guardians in the network
NUM_GUARDIANS=3

# Quorum size (automatically calculated as 2/3 + 1)
# For 3 guardians: need 3 signatures
# For 5 guardians: need 4 signatures
# For 7 guardians: need 5 signatures

# -----------------------------------------------------------------------------
# PRIVATE ETHEREUM (GUARDIAN REGISTRY)
# -----------------------------------------------------------------------------
# This is the private Geth node that stores the guardian set
# All guardians must connect to the same Geth node
GETH_RPC="ws://127.0.0.1:8546"
GETH_CONTRACT="0xe654a1bfc5d17402681daf37acfb82da53b2258a"

# -----------------------------------------------------------------------------
# AVALANCHE L1 SUBNET
# -----------------------------------------------------------------------------
AVALANCHE_RPC="ws://20.253.174.32:80/ext/bc/2ALtzRYgRpRWnTgjdrMArkMvU6RTpcjs7VWmupqYaPrHDrHLSd/ws"
AVALANCHE_CONTRACT="0x4f8270c650d1dd73f5d13eb2464c19e35f85a8d8"

# -----------------------------------------------------------------------------
# SOLANA CLUSTER
# -----------------------------------------------------------------------------
SOLANA_RPC="http://127.0.0.1:8899"
SOLANA_CONTRACT="G9TA5QaG3XutR4LCCGzcfdoP6LB4e2YSp5D98vhN5cea"

# -----------------------------------------------------------------------------
# P2P NETWORK
# -----------------------------------------------------------------------------
# Port for P2P communication (each guardian uses same port on different VMs)
P2P_PORT=8999

# Bootstrap peers (comma-separated list of guardian-0's multiaddr)
# Format: /ip4/<IP>/udp/<PORT>/quic-v1/p2p/<PEER_ID>
# Leave empty for guardian-0 (it's the bootstrap node)
# Other guardians must set this after guardian-0 starts
BOOTSTRAP_PEERS=""

# -----------------------------------------------------------------------------
# API PORTS
# -----------------------------------------------------------------------------
# gRPC API port (for fetching VAAs)
GRPC_PORT=7000

# Metrics/status port
STATUS_PORT=6600

# -----------------------------------------------------------------------------
# PATHS (relative to installation directory)
# -----------------------------------------------------------------------------
# Guardian private key file
KEY_FILE="keys/guardian-${GUARDIAN_INDEX}.key"

# Data directory for guardian state
DATA_DIR="data/guardian-${GUARDIAN_INDEX}"

# Log file
LOG_FILE="logs/guardian-${GUARDIAN_INDEX}.log"

# Admin socket for CLI commands
ADMIN_SOCKET="data/guardian-${GUARDIAN_INDEX}.sock"

# -----------------------------------------------------------------------------
# LOGGING
# -----------------------------------------------------------------------------
# Log level: debug, info, warn, error
LOG_LEVEL="info"

# Log rotation: maximum age in days before rotation
LOG_MAX_AGE_DAYS=1

# Log rotation: maximum size in MB before rotation
LOG_MAX_SIZE_MB=100

# Log rotation: number of old log files to keep
LOG_KEEP_FILES=7

# -----------------------------------------------------------------------------
# GUARDIAN ADDRESSES (for contract deployment reference)
# -----------------------------------------------------------------------------
# IMPORTANT: In unsafeDevMode, these are DETERMINISTIC addresses based on hostname.
# These addresses are generated automatically when hostname is guardian-X.
# Use these addresses when deploying contracts!
GUARDIAN_0_ADDRESS="0xbeFA429d57cD18b7F8A4d91A2da9AB4AF05d0FBe"
GUARDIAN_1_ADDRESS="0x88D7D8B32a9105d228100E72dFFe2Fae0705D31c"
GUARDIAN_2_ADDRESS="0x58076F561CC62A47087B567C86f986426dFCD000"

# -----------------------------------------------------------------------------
# ADVANCED SETTINGS
# -----------------------------------------------------------------------------
# Disable telemetry (recommended for private networks)
DISABLE_TELEMETRY=true

# Enable unsafe dev mode (ONLY for testing, never in production!)
# When true, guardian generates deterministic keys based on hostname
# Set to false when using real keys from keygen.sh
# IMPORTANT: Set to true for private networks with custom chain IDs
# This bypasses chain ID verification but still uses your own keys
UNSAFE_DEV_MODE=true

