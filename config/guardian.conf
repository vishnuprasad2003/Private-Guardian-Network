# -----------------------------------------------------------------------------
# ADVANCED SETTINGS
# -----------------------------------------------------------------------------
# Disable telemetry (recommended for private networks)
DISABLE_TELEMETRY=true

# Enable unsafe dev mode (for testing with custom chain IDs)
# When true:
#   - Guardian generates deterministic keys based on hostname
#   - Chain ID verification is bypassed
#   - Hostname MUST be "guardian-X" (guardian-0, guardian-1, etc.)
#
# When false (production):
#   - Generate your own keys with: bin/guardian keygen
#   - Use any hostname you want
UNSAFE_DEV_MODE=true

# Testnet mode (enables testnet chain IDs, reduces security requirements)
TESTNET_MODE=true

