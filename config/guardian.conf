# =============================================================================
# PRIVATE GUARDIAN NETWORK - CONFIGURATION
# =============================================================================
# This file contains ALL configuration for the guardian node.
# Copy this file to each VM and modify GUARDIAN_INDEX and network-specific settings.
#
# SINGLE SOURCE OF TRUTH: All scripts read from this file. Change values here only!
# =============================================================================

# -----------------------------------------------------------------------------
# GUARDIAN IDENTITY
# -----------------------------------------------------------------------------
# Unique index for this guardian (0, 1, 2, etc.)
# Each VM must have a different GUARDIAN_INDEX
#
# IMPORTANT (unsafeDevMode): The hostname MUST match "guardian-${GUARDIAN_INDEX}"
# Example: If GUARDIAN_INDEX=0, hostname must be "guardian-0"
# This is because Wormhole generates deterministic keys based on hostname.
GUARDIAN_INDEX=0

# Network identifier (must be same across all guardians)
NETWORK_ID="/wormhole/private/mainnet/1"

# -----------------------------------------------------------------------------
# GUARDIAN NETWORK SETTINGS
# -----------------------------------------------------------------------------
# Total number of guardians in the network
NUM_GUARDIANS=1

# Quorum size (automatically calculated as 2/3 + 1)
# For 1 guardian:  need 1 signature
# For 3 guardians: need 3 signatures
# For 5 guardians: need 4 signatures
# For 7 guardians: need 5 signatures

# -----------------------------------------------------------------------------
# ANVIL (LOCAL ETHEREUM REGISTRY)
# -----------------------------------------------------------------------------
# Anvil serves as the guardian registry (simpler than Geth)
# All guardians must connect to the same Anvil instance
ANVIL_PORT=8545
ANVIL_HOST="127.0.0.1"
ANVIL_CHAIN_ID=31337

# WebSocket RPC URL (used by guardian)
GETH_RPC="ws://${ANVIL_HOST}:${ANVIL_PORT}"

# HTTP RPC URL (used by deployment scripts)
GETH_RPC_HTTP="http://${ANVIL_HOST}:${ANVIL_PORT}"

# Wormhole contract address on Anvil (set after deploying)
GETH_CONTRACT="0x5fc8d32690cc91d4c39d9d3abcbd16989f875707"

# Anvil pre-funded deployer account (don't change)
ANVIL_PRIVATE_KEY="ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"

# -----------------------------------------------------------------------------
# AVALANCHE L1 SUBNET
# -----------------------------------------------------------------------------
# WebSocket RPC URL (REQUIRED by guardian)
AVALANCHE_RPC="ws://20.253.174.32:80/ext/bc/2ALtzRYgRpRWnTgjdrMArkMvU6RTpcjs7VWmupqYaPrHDrHLSd/ws"

# HTTP RPC URL (used by deployment and cast commands)
AVALANCHE_RPC_HTTP="http://20.253.174.32:80/ext/bc/2ALtzRYgRpRWnTgjdrMArkMvU6RTpcjs7VWmupqYaPrHDrHLSd/rpc"

# Avalanche native chain ID (get via: cast chain-id --rpc-url $AVALANCHE_RPC_HTTP)
AVALANCHE_CHAIN_ID=101122

# Wormhole contract address on Avalanche (set after deploying)
AVALANCHE_CONTRACT="0xcd98a4de5a5adbca78c62afe7c55bab023664362"

# Deployer private key (set before deploying)
# NEVER commit this! Use: export AVALANCHE_DEPLOYER_KEY="0x..."
#AVALANCHE_DEPLOYER_KEY=""

# -----------------------------------------------------------------------------
# SOLANA CLUSTER
# -----------------------------------------------------------------------------
# Solana RPC URL
SOLANA_RPC="http://127.0.0.1:8899"

# WebSocket URL (for subscriptions)
SOLANA_WS="ws://127.0.0.1:8900"

# Wormhole Core Bridge program ID on Solana
SOLANA_CONTRACT="G9TA5QaG3XutR4LCCGzcfdoP6LB4e2YSp5D98vhN5cea"

# Deployer keypair path (default Solana CLI keypair)
SOLANA_KEYPAIR="~/.config/solana/id.json"

# -----------------------------------------------------------------------------
# P2P NETWORK (How guardians find each other)
# -----------------------------------------------------------------------------
# Port for P2P communication (UDP/QUIC)
# MUST be open between all guardian VMs!
P2P_PORT=8999

# -----------------------------------------------------------------------------
# BOOTSTRAP PEERS (CRITICAL for multi-VM setup)
# -----------------------------------------------------------------------------
# This tells guardians how to find each other across VMs.
#
# GUARDIAN-0: Leave empty (it's the bootstrap node)
# GUARDIAN-1+: Set to guardian-0's multiaddr
#
# Format: /ip4/<GUARDIAN-0-IP>/udp/<P2P_PORT>/quic-v1/p2p/<PEER_ID>
#
# How to get PEER_ID:
#   1. Start guardian-0 first
#   2. Run: grep "P2P node identity" logs/guardian-0.log
#   3. Copy the ID (starts with 12D3KooW...)
#
# Example (replace with your guardian-0's IP and peer ID):
# BOOTSTRAP_PEERS="/ip4/10.0.0.10/udp/8999/quic-v1/p2p/12D3KooWR4cv1a8tv7pps4HH6wePNaK6gf1Hww5wcCMzeWxyNw6z"
#
# For local testing (all on same machine):
BOOTSTRAP_PEERS=""
#
# For multi-VM production (uncomment and edit):
#BOOTSTRAP_PEERS="/ip4/<GUARDIAN-0-PUBLIC-IP>/udp/8999/quic-v1/p2p/<PEER_ID>"

# -----------------------------------------------------------------------------
# API PORTS
# -----------------------------------------------------------------------------
# gRPC API port (for fetching VAAs)
GRPC_PORT=7000

# Metrics/status port
STATUS_PORT=6600

# VAA API server port
API_PORT=3000

# -----------------------------------------------------------------------------
# PATHS (relative to installation directory)
# -----------------------------------------------------------------------------
# Guardian private key file
KEY_FILE="keys/guardian-${GUARDIAN_INDEX}.key"

# Data directory for guardian state
DATA_DIR="data/guardian-${GUARDIAN_INDEX}"

# Log file
LOG_FILE="logs/guardian-${GUARDIAN_INDEX}.log"

# Admin socket for CLI commands
ADMIN_SOCKET="data/guardian-${GUARDIAN_INDEX}.sock"

# -----------------------------------------------------------------------------
# LOGGING
# -----------------------------------------------------------------------------
# Log level: debug, info, warn, error
LOG_LEVEL="info"

# Log rotation: maximum age in days before rotation
LOG_MAX_AGE_DAYS=1

# Log rotation: maximum size in MB before rotation
LOG_MAX_SIZE_MB=100

# Log rotation: number of old log files to keep
LOG_KEEP_FILES=7

