# Logrotate configuration for Private Guardian Network
# Install: sudo cp systemd/logrotate.conf /etc/logrotate.d/wormhole-guardian

/solana/wormhole/logs/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0644 azureuser azureuser
    sharedscripts
    postrotate
        # Reload systemd to pick up new log files
        systemctl reload guardian@*.service anvil.service > /dev/null 2>&1 || true
    endscript
}

# Anvil logs
/solana/wormhole/logs/anvil.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0644 azureuser azureuser
    sharedscripts
    postrotate
        systemctl reload anvil.service > /dev/null 2>&1 || true
    endscript
}
